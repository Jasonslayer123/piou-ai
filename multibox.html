<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multibox Controller</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #111; color: #eee; }
  #wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  button { padding: 8px 14px; border: 1px solid #444; background: #2a2a2a; color: #eee;
           border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.active { border-color: #4caf50; background: #1e3a1e; }
  #status { font-size: 13px; color: #9c9; margin-bottom: 8px; min-height: 18px; }
  #arena { position: relative; width: 100%; height: 420px; background: #1a1a1a;
           border: 1px solid #333; border-radius: 8px; overflow: hidden; touch-action: none; }
  .dot { position: absolute; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%, -50%); }
  #player { background: #4caf50; }
  #mouse { background: #ff9800; width: 10px; height: 10px; }
  #remote { background: #42a5f5; width: 10px; height: 10px; }
  #hint { margin-top: 10px; font-size: 12px; color: #888; line-height: 1.6; }
  label { font-size: 13px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Multibox Controller</h1>
  <div class="row">
    <button id="btnController">Controller</button>
    <button id="btnMirror">Mirror only</button>
    <button id="btnOpen">Open mirrored window</button>
  </div>
  <div class="row">
    <label><input type="checkbox" id="ckMouse" checked> Mirror mouse movement</label>
  </div>
  <div id="status">starting...</div>
  <div id="arena">
    <div class="dot" id="player"></div>
    <div class="dot" id="mouse"></div>
    <div class="dot" id="remote"></div>
  </div>
  <div id="hint">
    Open this page in two tabs (same browser). In one tab click <b>Controller</b>, in the other click <b>Mirror only</b>.
    Press arrow keys or W/A/S/D in the controller tab and both green dots should move together.
    Or click <b>Open mirrored window</b> to spawn a mirror instantly.
  </div>
</div>
<script>
  const pageId = Math.random().toString(36).slice(2);
  const params = new URLSearchParams(location.search);
  let role = params.get('role') || 'both';
  const player = document.getElementById('player');
  const mouseDot = document.getElementById('mouse');
  const remoteDot = document.getElementById('remote');
  const statusEl = document.getElementById('status');
  const state = { up:false, down:false, left:false, right:false };
  const playerX = 320, playerY = 200;
  const localX = 320, localY = 200;
  const remoteX = 320, remoteY = 200;
  let mirrorMouse = true;
  let received = 0;

  const KMAP = {
    ArrowUp:'up',  KeyW:'up',
    ArrowDown:'down', KeyS:'down',
    ArrowLeft:'left', KeyA:'left',
    ArrowRight:'right', KeyD:'right'
  };

  const bc = new BroadcastChannel('multibox-net');
  bc.onmessage = (e) => handle(e.data);
  window.addEventListener('message', (e) => handle(e.data));
  const children = [];

  function handle(msg) {
    if (!msg || msg.from === pageId) return;
    if (msg.type === 'keys') {
      received++;
      Object.assign(state, msg.state);
    } else if (msg.type === 'mouse') {
      received++;
      remoteX = Math.min(bounds('#arena').width  - 8, Math.max(8, remoteX + msg.dx));
      remoteY = Math.min(bounds('#arena').height - 8, Math.max(8, remoteY + msg.dy));
    }
    statusEl.textContent = 'linked (' + received + ' signals)';
  }

  function broadcast(msg) {
    msg.from = pageId;
    for (let i = children.length - 1; i >= 0; i--) {
      if (children[i].closed) children.splice(i, 1);
      else children[i].postMessage(msg, '*');
    }
    if (window.opener) window.opener.postMessage(msg, '*');
    bc.postMessage(msg);
  }

  document.addEventListener('keydown', (e) => {
    const k = KMAP[e.code];
    if (!k) return;
    e.preventDefault();
    if (state[k] === false && isController()) {
      state[k] = true;
      broadcast({ type:'keys', state:{...state} });
    }
  });

  document.addEventListener('keyup', (e) => {
    const k = KMAP[e.code];
    if (!k) return;
    e.preventDefault();
    if (state[k] === true && isController()) {
      state[k] = false;
      broadcast({ type:'keys', state:{...state} });
    }
  });

  document.addEventListener('pointermove', (e) => {
    localX += e.movementX || 0;
    localY += e.movementY || 0;
    const m = mirrorMouse && isController();
    if (m && (e.movementX || e.movementY)) {
      broadcast({ type:'mouse', dx:e.movementX, dy:e.movementY });
    }
  });

  function isController() { return role !== 'mirror'; }

  function bounds(sel) {
    const r = document.querySelector(sel).getBoundingClientRect();
    return { width: r.width, height: r.height };
  }

  function setRole(r) {
    role = r;
    document.getElementById('btnController').classList.toggle('active', role !== 'mirror');
    document.getElementById('btnMirror').classList.toggle('active', role === 'mirror');
    statusEl.textContent = role === 'mirror'
      ? 'MIRROR ONLY - this tab copies the controller'
      : 'CONTROLLER - this tab drives movement';
  }

  document.getElementById('btnController').onclick = () => setRole('both');
  document.getElementById('btnMirror').onclick = () => setRole('mirror');
  document.getElementById('btnOpen').onclick = () => {
    if (role === 'mirror') setRole('both');
    const w = window.open(location.href.split('?')[0] + '?role=mirror');
    if (w) children.push(w);
    else statusEl.textContent = 'POPUP BLOCKED - allow popups and try again';
  };
  document.getElementById('ckMouse').onchange = (e) => mirrorMouse = e.target.checked;

  function loop() {
    const sp = 3;
    if (state.up)    playerY -= sp;
    if (state.down)  playerY += sp;
    if (state.left)  playerX -= sp;
    if (state.right) playerX += sp;
    const r = bounds('#arena');
    player.style.left = Math.min(r.width - 10, Math.max(10, playerX)) + 'px';
    player.style.top  = Math.min(r.height - 10, Math.max(10, playerY)) + 'px';
    mouseDot.style.left = localX + 'px';
    mouseDot.style.top  = localY + 'px';
    remoteDot.style.left = remoteX + 'px';
    remoteDot.style.top  = remoteY + 'px';
    requestAnimationFrame(loop);
  }

  setRole(role);
  requestAnimationFrame(loop);
</script>
</body>
</html>
